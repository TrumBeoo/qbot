server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router dung client-side routing: moi duong dan khong phai file
    # thuc phai tra ve index.html, khong thi F5 giua app se ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html khong duoc cache, khong thi nguoi dung giu ban cu
    # tro tới file assets da bi thay ten.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
